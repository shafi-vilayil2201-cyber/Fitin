name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.416

      - name: Restore
        run: dotnet restore Fitin.sln

      - name: Build
        run: dotnet build Fitin.sln -c Release --no-restore

      - name: Publish API
        run: dotnet publish Fitin.API/Fitin.API.csproj -c Release --no-build -o ./publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitin-api-publish
          path: ./publish
